name: Pull Request Requirements

on:
  pull_request:
    branches: ["*.*.x", "*.x", "main", "next", "next-major", "beta", "alpha"]

  workflow_call: # allow this workflow to be called by other workflows

jobs:
  unit_tests:
    # Pull requests from forks run untrusted code (workflow, local actions,
    # package.json lifecycle scripts, as-pect config). Keep that off the
    # persistent, shared self-hosted pool and use ephemeral GitHub-hosted
    # runners instead, as release.yaml already does.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up repo submodules
        run: git submodule update --init --recursive

      - name: Setup Node Environment
        uses: ./.github/setup-node

      - name: Unit Tests
        run: |
          pnpm test
